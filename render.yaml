services:
  - type: web
    name: fir-app
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn fir_project.wsgi:application
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fir-db
          property: connectionString
      - key: EMAIL_HOST
        value: smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: noreply@yourdomain.com
      - key: SECRET_KEY
        value: change-this-to-a-strong-secret-key
      - key: DEBUG
        value: "false"

databases:
  - name: fir-db
    plan: free
